[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-engine"
version = "0.1.0"
description = "A modern, test-driven Xiangqi engine in Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Augustus Seabrooke"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xiangqi = "xiangqi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
